---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260923-home-functions-gateway-cors-r3

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260923-home-functions-gateway-cors-r3",
              "candidate_run_id": "35937332719",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10783084611",
              "candidate_spec_sha256": "06cd05d95d2b380863f7aa8ec023e0eb2831b5344412223037d161a69d763bd2",
              "baseline_run_id": "35937165203",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "10783426360"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260923-home-functions-gateway-cors-r3",
              "candidate_run_id": "35937332719",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10783084611",
              "candidate_spec_sha256": "06cd05d95d2b380863f7aa8ec023e0eb2831b5344412223037d161a69d763bd2"
            }
          }
          JSON
