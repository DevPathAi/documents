---
# Immutable action pins and authenticated artifact URLs exceed 80 columns.
# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Mission Spine Privacy Approval

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier from the canonical candidate
        required: true
        type: string
      candidate_spec_sha256:
        description: SHA-256 of the exact raw canonical candidate-spec bytes
        required: true
        type: string
      approval_source_sha:
        description: Exact protected main Documents source SHA from the candidate
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mission-spine-privacy-approval-${{ inputs.release_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  approve-analytics-privacy-release:
    if: github.ref == 'refs/heads/main'
    name: Approve analytics privacy release
    environment: mission-spine-privacy-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.12.0'

      - name: Reject source, candidate, and rerun ambiguity
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          APPROVAL_SOURCE_SHA: ${{ inputs.approval_source_sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1 || {
            echo 'Privacy approval retries require a fresh workflow_dispatch' >&2
            exit 1
          }
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REPOSITORY}" = DevPathAi/documents
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${RELEASE_ID}" =~ ^ms-[0-9]{8}-[a-z0-9][a-z0-9-]{2,40}$ ]]
          [[ "${CANDIDATE_SPEC_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${CANDIDATE_SPEC_SHA256}" != "$(printf '0%.0s' {1..64})"
          [[ "${APPROVAL_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${APPROVAL_SOURCE_SHA}" != "$(printf '0%.0s' {1..40})"
          test "${GITHUB_SHA}" = "${APPROVAL_SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${APPROVAL_SOURCE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      # devpath-evidence-reader(gitops 단독 설치, 전부 read-only)로 GitOps 읽기와
      # 조직 Members read(조직 수준 권한이라 레포 선택과 무관)를 민팅한다.
      # documents 자기 레포 읽기는 이미 github.token(GITHUB_TOKEN)이 담당한다 —
      # 레거시 org App 비밀(GITOPS_APP_ID/KEY) 의존 제거(2026-08-22).
      - name: Mint read-only GitOps and organization token
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.MISSION_SPINE_EVIDENCE_READER_APP_ID }}
          private-key: ${{ secrets.MISSION_SPINE_EVIDENCE_READER_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: |
            devpath-gitops
          permission-actions: read
          permission-contents: read
          permission-members: read

      - name: Authenticate protected environment approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "${ORG_TOKEN}"
          root="${RUNNER_TEMP}/mission-spine-privacy-approval"
          test ! -e "${root}"
          mkdir "${root}"
          node tools/mission_spine_privacy_approval.mjs authenticate-approval \
            --repository-root=. \
            --source-sha="${GITHUB_SHA}" \
            --run-id="${GITHUB_RUN_ID}" \
            --run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --output="${root}/approval.json"

      - name: Authenticate exact canonical candidate bytes
        shell: bash
        env:
          GITOPS_TOKEN: ${{ steps.gitops-token.outputs.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          APPROVAL_SOURCE_SHA: ${{ inputs.approval_source_sha }}
        run: |
          set -euo pipefail
          test -n "${GITOPS_TOKEN}"
          root="${RUNNER_TEMP}/mission-spine-privacy-approval"
          node tools/mission_spine_privacy_approval.mjs fetch-candidate \
            --release-id="${RELEASE_ID}" \
            --candidate-spec-sha256="${CANDIDATE_SPEC_SHA256}" \
            --approval-source-sha="${APPROVAL_SOURCE_SHA}" \
            --output="${root}/candidate-spec.json"

      - name: Generate and revalidate exact privacy evidence
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
          APPROVAL_SOURCE_SHA: ${{ inputs.approval_source_sha }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/mission-spine-privacy-approval"
          node tools/mission_spine_privacy_approval.mjs create-evidence \
            --candidate="${root}/candidate-spec.json" \
            --approval="${root}/approval.json" \
            --package-root="${root}/package" \
            --release-id="${RELEASE_ID}" \
            --candidate-spec-sha256="${CANDIDATE_SPEC_SHA256}" \
            --approval-source-sha="${APPROVAL_SOURCE_SHA}" \
            --producer-run-id="${GITHUB_RUN_ID}" \
            --producer-run-attempt="${GITHUB_RUN_ATTEMPT}"
          node tools/mission_spine_privacy_approval.mjs validate-evidence \
            --candidate="${root}/candidate-spec.json" \
            --approval="${root}/approval.json" \
            --package-root="${root}/package" \
            --release-id="${RELEASE_ID}" \
            --candidate-spec-sha256="${CANDIDATE_SPEC_SHA256}" \
            --approval-source-sha="${APPROVAL_SOURCE_SHA}" \
            --producer-run-id="${GITHUB_RUN_ID}" \
            --producer-run-attempt="${GITHUB_RUN_ATTEMPT}"

      - name: Upload exact run-scoped privacy evidence
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ inputs.release_id }}-privacy-approval-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mission-spine-privacy-approval/package/evidence.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 30

      - name: Re-authenticate uploaded ZIP envelope and evidence bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          APPROVAL_SOURCE_SHA: ${{ inputs.approval_source_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          root="${RUNNER_TEMP}/mission-spine-privacy-approval"
          artifact_name="${RELEASE_ID}-privacy-approval-run-${GITHUB_RUN_ID}-attempt-1"
          test ! -e "${root}/artifact.json"
          test ! -e "${root}/artifact.zip"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 1 --remove-on-error \
            --proto '=https' --proto-redir '=https' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --max-filesize 1048576 \
            "https://api.github.com/repos/DevPathAi/documents/actions/artifacts/${ARTIFACT_ID}" \
            --output "${root}/artifact.json"
          node tools/mission_spine_privacy_approval.mjs validate-artifact-metadata \
            --metadata="${root}/artifact.json" \
            --artifact-id="${ARTIFACT_ID}" \
            --artifact-name="${artifact_name}" \
            --artifact-digest="${ARTIFACT_DIGEST}" \
            --run-id="${GITHUB_RUN_ID}" \
            --source-sha="${APPROVAL_SOURCE_SHA}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 1 --remove-on-error \
            --proto '=https' --proto-redir '=https' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --max-filesize 1048576 \
            "https://api.github.com/repos/DevPathAi/documents/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${root}/artifact.zip"
          node tools/mission_spine_privacy_approval.mjs validate-artifact-zip \
            --zip="${root}/artifact.zip" \
            --evidence="${root}/package/evidence.json" \
            --expected-zip-sha256="${ARTIFACT_DIGEST}"

  dispatch-privacy-approval:
    if: github.ref == 'refs/heads/chore/prod26r8-privacy-dispatch'
    name: Dispatch exact privacy approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      RELEASE_ID: ms-20260829-prod26r8
      CANDIDATE_SPEC_SHA256: a0ad5fd087db806c56fe41f195b7722cd97a821b71c6178f2959a12679d0614f
      SOURCE_SHA: 7f732ac5ba31a91e81ea4e557cb7f67c8ee5ca36
      INPUT_RELEASE_ID: ${{ inputs.release_id }}
      INPUT_CANDIDATE_SPEC_SHA256: ${{ inputs.candidate_spec_sha256 }}
      INPUT_SOURCE_SHA: ${{ inputs.approval_source_sha }}
      GITHUB_API_VERSION: "2026-03-10"
    steps:
      - name: Prove the exact one-shot dispatcher context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/chore/prod26r8-privacy-dispatch"
          test "$INPUT_RELEASE_ID" = "$RELEASE_ID"
          test "$INPUT_CANDIDATE_SPEC_SHA256" = "$CANDIDATE_SPEC_SHA256"
          test "$INPUT_SOURCE_SHA" = "$SOURCE_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Dispatch protected main through the repository Actions App
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          )"
          test "$current_main" = "$SOURCE_SHA"

          payload="$RUNNER_TEMP/prod26r8-privacy-dispatch.json"
          response="$RUNNER_TEMP/prod26r8-privacy-dispatch-response.json"
          run_document="$RUNNER_TEMP/prod26r8-privacy-run.json"
          test ! -e "$payload"
          test ! -e "$response"
          test ! -e "$run_document"
          umask 077
          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg candidate_spec_sha256 "$CANDIDATE_SPEC_SHA256" \
            --arg approval_source_sha "$SOURCE_SHA" \
            '{
              "ref": "main",
              "inputs": {
                "release_id": $release_id,
                "candidate_spec_sha256": $candidate_spec_sha256,
                "approval_source_sha": $approval_source_sha
              }
            }' >"$payload"

          gh api --method POST \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            --input "$payload" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mission-spine-privacy-approval.yml/dispatches" \
            >"$response"
          inner_run_id="$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' "$response")"
          [[ "$inner_run_id" =~ ^[1-9][0-9]*$ ]]

          cancel_inner() {
            gh api --method POST \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$inner_run_id/cancel" \
              >/dev/null 2>&1 || true
          }
          trap 'status=$?; if test "$status" -ne 0; then cancel_inner; fi; exit "$status"' EXIT

          for attempt in $(seq 1 12); do
            if gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$inner_run_id" \
              >"$run_document"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 1
          done

          inner_actor="$(jq -er '.actor.login' "$run_document")"
          inner_triggering_actor="$(jq -er '.triggering_actor.login' "$run_document")"
          test "$inner_actor" = "github-actions[bot]"
          test "$(jq -er '.actor.id' "$run_document")" = "41898282"
          test "$(jq -er '.actor.type' "$run_document")" = "Bot"
          test "$inner_triggering_actor" = "github-actions[bot]"
          test "$(jq -er '.triggering_actor.id' "$run_document")" = "41898282"
          test "$(jq -er '.triggering_actor.type' "$run_document")" = "Bot"
          test "$(jq -er '.event' "$run_document")" = "workflow_dispatch"
          test "$(jq -er '.head_branch' "$run_document")" = "main"
          test "$(jq -er '.head_sha' "$run_document")" = "$SOURCE_SHA"
          test "$(jq -er '.run_attempt' "$run_document")" = "1"
          test "$(jq -er '.path' "$run_document")" = ".github/workflows/mission-spine-privacy-approval.yml"
          test "$(jq -r '.conclusion' "$run_document")" = "null"
          trap - EXIT

          {
            echo "### Independent privacy approval dispatch"
            echo "- inner run: $inner_run_id"
            echo "- actor: $inner_actor"
            echo "- triggering actor: $inner_triggering_actor"
            echo "- source SHA: $SOURCE_SHA"
            echo "- candidate SHA-256: $CANDIDATE_SPEC_SHA256"
          } >>"$GITHUB_STEP_SUMMARY"
