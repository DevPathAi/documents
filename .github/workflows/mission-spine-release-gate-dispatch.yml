---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260920-community-flat-pages

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected privacy approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch privacy approval as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-privacy-approval.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages",
              "candidate_spec_sha256": "e12921324ea5a1e325bb8125631aba7a653375d49ad46c5c91ec7031cf2640a7",
              "approval_source_sha": "7f732ac5ba31a91e81ea4e557cb7f67c8ee5ca36"
            }
          }
          JSON
