---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260930-s3-web-redesign

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected privacy approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch privacy approval as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-privacy-approval.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign",
              "candidate_spec_sha256": "4397add36ce5b6ff883f648ec7396de1c2760c06c692327adcdc716588149212",
              "approval_source_sha": "7f732ac5ba31a91e81ea4e557cb7f67c8ee5ca36"
            }
          }
          JSON
